[project]
name = "humanoid-companion"
version = "0.1.0"
description = "A small simulated humanoid that walks, gestures, shows a face and talks, driven by a language model you run yourself"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Yauhen Bichel" }]
requires-python = "==3.12.*"
keywords = ["humanoid", "robotics", "mujoco", "reinforcement-learning", "sim-to-real", "llm", "text-to-speech", "robot-face"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "playground==0.2.0",
    "jax==0.9.2",
    "mujoco==3.13.0",
    "mujoco-mjx==3.13.0",
    "brax==0.14.2",
    "numpy",
    "pillow",   # the face drawn frame by frame for videos (humanoid_companion.face.render)
]

[project.optional-dependencies]
# Microphone and speaker (humanoid_companion.voice record/play); PortAudio is bundled in the
# macOS wheel, on Linux it needs libportaudio2.
voice = ["sounddevice==0.5.6"]

[project.scripts]
humanoid-talk = "humanoid_companion.talk:main"
humanoid-sim = "humanoid_companion.run_sim:main"

[project.urls]
Homepage = "https://github.com/YauhenBichel/humanoid-companion"
Issues = "https://github.com/YauhenBichel/humanoid-companion/issues"

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/humanoid_companion"]

[tool.pytest.ini_options]
testpaths = ["tests"]
